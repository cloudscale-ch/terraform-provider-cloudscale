# This GitHub action runs your tests for each commit push and/or PR. Optionally
# you can turn it on using a cron schedule for regular testing.
#
name: Terraform Integration Tests
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  # For systems with an upstream API that could drift unexpectedly (like most SaaS systems, etc.),
  # we recommend testing at a regular interval not necessarily tied to code changes. This will
  # ensure you are alerted to something breaking due to an API change, even if the code did not
  # change.
  schedule:
    - cron: '44 4 * * *'
  # Allow manual execution through the UI by collaborators
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  # ensure the code builds...
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false
      id: go

    - name: Build
      run: |
        go build -v .

  # run acceptance tests in a matrix with Terraform core versions
  test:
    name: Matrix Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # list whatever Terraform versions here you would like to support
        runs: [
          # test with 1.0 and the three most recent according to
          # https://github.com/hashicorp/terraform/releases
          {terraform: '1.0.0', testargs: "-run TestAccCloudscaleServer_Basic"},
          {terraform: '1.13.0', testargs: "-run TestAccCloudscaleServer_Basic"},
          {terraform: '1.14.0', testargs: "-run TestAccCloudscaleServer_Basic"},
          {terraform: '1.15.0', testargs: "-run TestAccCloudscaleServer_Basic"},
          {terraform: 'latest', testargs: ""},
        ]
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false
      id: go

    # Pre-install a pinned Terraform CLI binary so the acceptance test
    # harness never falls back to hc-install's live "latest" lookup against
    # checkpoint-api.hashicorp.com, which has become an unreliable 502
    # source.
    - name: Set up Terraform CLI
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ matrix.runs.terraform }}
        terraform_wrapper: false

    - name: Verify Terraform CLI version
      run: terraform version

    - name: TF acceptance tests
      timeout-minutes: 120
      env:
        TF_ACC: "1"

        # Set whatever additional acceptance test env vars here. You can
        # optionally use data from your repository secrets using the
        # following syntax:
        # SOME_VAR: ${{ secrets.SOME_VAR }}
        CLOUDSCALE_API_TOKEN: ${{ secrets.CLOUDSCALE_TOKEN }}
        TESTARGS: ${{ matrix.runs.testargs }}
      if: env.CLOUDSCALE_API_TOKEN != null

      run: |
        go test ./... -v $TESTARGS -timeout 120m
